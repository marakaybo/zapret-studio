[package]
name = "zapret-studio"
version = "1.5.0"
description = "Zapret Studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zapret_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "socks"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
chrono = "0.4"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
